[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intellil3"
version = "0.1.0"
description = "L3 object storage layer for LLM serving"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/l3store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"