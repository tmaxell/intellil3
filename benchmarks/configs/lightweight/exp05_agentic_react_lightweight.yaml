experiment:
  name: "Agentic ReAct Workflow (Lightweight)"
  description: "Lightweight synthetic single-agent ReAct loop"

workload:
  type: "agentic_workflow"
  scenario: "react"
  num_workflows: 12
  num_agents: 1
  turns_per_workflow: 4
  shared_system_prompt_ratio: 0.8
  tool_call_probability: 0.6
  tool_latency_distribution: [80.0, 600.0]
  rag_call_probability: 0.25
  branching_factor: 1.0
  plan_reuse_probability: 0.4
  context_growth_per_turn: 96
  l2_capacity_mb: 384
  l3_latency_ms: 120.0
  seed: 42

systems:
  - name: "baseline_lru"
    type: "lru_l3"
  - name: "agentic_active_l3"
    type: "agentic_active_l3"

metrics:
  - job_completion_time_p95
  - step_latency_p95
  - kv_reload_count
  - tool_wait_hidden_ms
  - workflow_cache_hit_rate
