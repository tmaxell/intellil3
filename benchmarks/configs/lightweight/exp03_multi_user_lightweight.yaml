experiment:
  name: "Multi User Chat (Lightweight)"
  description: "Lightweight concurrent sessions sharing system prompts"

workload:
  type: "multi_user_chat"
  num_users: 15
  requests_per_user: 4
  shared_system_prompt: "You are a helpful assistant."
  seed: 42

systems:
  - name: "baseline_lru_l3"
  - name: "l3_full"

output:
  results_path: "benchmarks/results/lightweight/exp03/results.json"
  report_path: "benchmarks/results/lightweight/exp03/report.md"
